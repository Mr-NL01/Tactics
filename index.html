<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tactics</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tactics">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0D11">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Archivo+Black&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0B0D11;
    color: #9AA1AA;
    font-family: Archivo, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { width: 100%; max-width: 420px; }
  h1 {
    font-family: "Archivo Black", Archivo, system-ui, sans-serif;
    font-size: 15px;
    letter-spacing: .14em;
    color: #5C636D;
    margin: 0 0 18px 2px;
  }
  a.card {
    display: block;
    text-decoration: none;
    background: #FAFAF7;
    border: 9px solid #9DA4AB;
    border-radius: 16px;
    box-shadow: 0 18px 44px rgba(0,0,0,.55);
    padding: 20px 18px;
    margin-bottom: 16px;
  }
  a.card:active { transform: translateY(1px); }
  .title {
    font-family: "Archivo Black", Archivo, system-ui, sans-serif;
    font-size: 21px;
    color: #17181E;
    line-height: 1.1;
  }
  .sub { font-size: 13px; color: #6A6E74; margin-top: 5px; }
  .rule { height: 2.5px; background: #14161A; margin: 14px -18px 0; }
  .marks { display: flex; gap: 8px; padding-top: 12px; }
  .marks svg { height: 26px; }
  .foot { font-size: 11.5px; color: #4A515E; margin: 6px 2px 0; line-height: 1.5; }
</style>

<div class="wrap">
  <h1>SCHEER TACTICS</h1>

  <a class="card" href="board/">
    <div class="title">Scoreboard</div>
    <div class="sub">One game, marks and points per number</div>
    <div class="rule"></div>
    <div class="marks">
      <svg viewBox="0 0 34 30"><g stroke="#17181E" stroke-width="4.3" stroke-linecap="round" fill="none">
        <path d="M 6 25 Q 17 14 28 6"/><path d="M 6 6 Q 18 16 28 25"/></g></svg>
      <svg viewBox="0 0 34 30"><g stroke="#1E3FB0" stroke-width="4.6" stroke-linecap="round" fill="none">
        <path d="M 7 24 Q 16 15 27 7"/><path d="M 6 7 Q 17 15 27 24"/></g></svg>
    </div>
  </a>

  <a class="card" href="tracker/">
    <div class="title">Tournament tracker</div>
    <div class="sub">Schedule, results and standings</div>
    <div class="rule"></div>
    <div class="marks">
      <svg viewBox="0 0 34 30"><g stroke="#17181E" stroke-width="4.3" stroke-linecap="round" fill="none">
        <path d="M 5 24 Q 17 15 29 7"/><path d="M 6 8 Q 16 15 28 24"/></g></svg>
    </div>
  </a>

  <p class="foot">Add each one to your home screen separately. They keep their own saved state.</p>
</div>
