<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tactics</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tactics">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0D11">
<link rel="apple-touch-icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Archivo+Black&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0B0D11;
    color: #9AA1AA;
    font-family: Archivo, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { width: 100%; max-width: 420px; }
  .logo {
    display: block;
    width: 120px;
    height: 120px;
    margin: 0 auto 18px;
    border-radius: 20px;
    border: 3px solid #9DA4AB;
    box-shadow: 0 18px 44px rgba(0,0,0,.55);
    object-fit: cover;
  }
  h1 {
    font-family: "Archivo Black", Archivo, system-ui, sans-serif;
    font-size: 15px;
    letter-spacing: .14em;
    color: #5C636D;
    margin: 0 0 18px 2px;
    text-align: center;
  }
  a.card {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    background: #FAFAF7;
    border: 9px solid #9DA4AB;
    border-radius: 16px;
    box-shadow: 0 18px 44px rgba(0,0,0,.55);
    padding: 34px 18px;
    margin-bottom: 16px;
  }
  a.card:active { transform: translateY(1px); }
  .title {
    font-family: "Archivo Black", Archivo, system-ui, sans-serif;
    font-size: 24px;
    color: #17181E;
    line-height: 1.1;
  }
  .foot { font-size: 11.5px; color: #4A515E; margin: 6px 2px 0; line-height: 1.5; }
</style>

<div class="wrap">
  <img class="logo" src="logo.jpg" alt="Tactics logo">
  <h1>TACTICS</h1>

  <a class="card" href="board/">
    <div class="title">Scoreboard</div>
  </a>

  <a class="card" href="tracker/">
    <div class="title">Tournament</div>
  </a>

  <p class="foot">Add each one to your home screen separately. They keep their own saved state.</p>
</div>
